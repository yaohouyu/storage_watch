name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Engine tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v

  app:
    name: Build app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build with embedded Python
        run: |
          cd app
          SDKROOT="$(xcrun --show-sdk-path)" ./build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: StorageWatch-app
          path: app/build/Storage Watch.app
