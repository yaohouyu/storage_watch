name: Update star chart

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render star history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/make_star_chart.py
      - name: Commit when changed
        run: |
          if git diff --quiet -- site/assets/stars.svg; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/stars.svg
          git commit -m "chore: refresh star history"
          git push
